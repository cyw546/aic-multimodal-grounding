[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aic-multimodal-grounding"
version = "0.1.0"
description = "Data and evaluation pipeline for the AIC multimodal visual grounding challenge"
requires-python = ">=3.10,<3.12"
dependencies = [
  "numpy>=1.26,<2",
  "opencv-python-headless>=4.10,<5",
  "torch>=2.3,<2.4",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
